# TEMPLATE — not read by lftraining_release.sh.
#
# Every course must commit its own course-build-config.yaml at its repo root;
# there is no shared fallback (a fallback let a course's actual build silently
# drift from what it claimed to need). Copy this file into the course repo as
# course-build-config.yaml and fill in real values.
#
# image: the Docker image to build with. The script always prompts with this as
# the default — press Enter to accept it, or type a different image for this run.
image: eeganlf/lf-tex-full-2025:v1.0

# ilt-build-command / elearning-build-command: the full shell command used to
# build this course. ${IMAGE} is replaced with the resolved image above before
# the command runs — it's a placeholder the release script substitutes, not
# YAML syntax, so keep it exactly as written.
ilt-build-command: >
  docker run --rm -v $(pwd):/$(basename $(pwd)) --user $(id -u):$(id -g)
  --workdir /$(basename $(pwd)) ${IMAGE} /bin/bash -c "make release-full"

elearning-build-command: >
  docker run --rm -v $(pwd):/$(basename $(pwd)) --user $(id -u):$(id -g)
  --workdir /$(basename $(pwd)) ${IMAGE} /bin/bash -c "make release-elearning"

# build-system-version: the tag (in the build-system submodule, see below) this
# course must build against. The script checks this out explicitly after
# `git submodule update`, so an incorrectly-pinned submodule is caught and
# corrected for the build instead of silently used as-is.
build-system-version: 2.0.1

# build-system-submodule: path to the build-system submodule within the course
# repo. Optional — defaults to "common" if omitted. Some courses use a
# differently named submodule, e.g. LFD473 uses "common_LFD".
# build-system-submodule: common
